name: Keep Backend Alive

on:
  schedule:
    # Run every 5 minutes (GitHub Actions minimum is 5 minutes)
    # For more frequent pings (every 3m 30s), use cron-job.org or similar
    - cron: "*/5 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Backend
        run: |
          # Replace with your actual Render backend URL
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "RENDER_BACKEND_URL secret not set. Please add it to repository secrets."
            exit 1
          fi

          echo "Pinging backend at: $BACKEND_URL"
          response=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/auth/me" \
            -H "Content-Type: application/json" \
            --max-time 10)

          if [ "$response" -eq 200 ] || [ "$response" -eq 401 ]; then
            echo "✅ Backend ping successful (HTTP $response)"
          else
            echo "❌ Backend ping failed (HTTP $response)"
            exit 1
          fi
